<svg xmlns="http://www.w3.org/2000/svg" width="760" height="820" viewBox="0 0 760 820" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>HPSP and OSDP: today, native HPSP and two ways to migrate</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="820" fill="#FFFFFF"/>
<text x="380" y="24" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#2C2C2A">Where HPSP sits next to OSDP</text>
<text x="380" y="46" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">OSDP readers keep working: HPSP wraps them, then they can be replaced at your own pace.</text>
<rect x="20" y="70" width="720" height="130" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="88" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Today: OSDP over RS-485</text>
<rect x="40" y="106" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="115.0" y="132.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Reader</text>
<text x="115.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">OSDP peripheral (PD)</text>
<rect x="570" y="106" width="150" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="645.0" y="132.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Controller</text>
<text x="645.0" y="150.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">OSDP control panel</text>
<line x1="190" y1="141" x2="570" y2="141" stroke="#73726c" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="380" y="124" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">RS-485 serial bus, OSDP</text>
<text x="380" y="160" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">Controller polls the reader; AES-128 key per reader</text>
<rect x="20" y="218" width="720" height="130" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="236" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">HPSP native: a reader that speaks HPSP</text>
<rect x="40" y="254" width="150" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="115.0" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">HPSP reader</text>
<text x="115.0" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Own certificate</text>
<rect x="570" y="254" width="150" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="645.0" y="280.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ACU</text>
<text x="645.0" y="298.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Controller with HPSP</text>
<line x1="190" y1="289" x2="570" y2="289" stroke="#73726c" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="380" y="272" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Ethernet link (including single-pair), TLS 1.3</text>
<text x="380" y="308" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">Reader reports events at once; doors open only for signed grants</text>
<rect x="20" y="366" width="720" height="170" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="384" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Migration B: a gateway runs the OSDP side</text>
<rect x="40" y="410" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="105.0" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">OSDP reader</text>
<text x="105.0" y="454.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Existing, unchanged</text>
<rect x="305" y="404" width="150" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="380.0" y="427.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">HPSP gateway</text>
<text x="380.0" y="445.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Runs the OSDP panel</text>
<text x="380.0" y="463.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Holds the reader's key</text>
<rect x="590" y="410" width="130" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="655.0" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ACU</text>
<text x="655.0" y="454.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Sees a native reader</text>
<line x1="170" y1="445" x2="305" y2="445" stroke="#73726c" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="237" y="427" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#2C2C2A">RS-485</text>
<text x="237" y="463" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">OSDP, local</text>
<line x1="455" y1="445" x2="590" y2="445" stroke="#73726c" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="522" y="427" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#2C2C2A">TLS 1.3</text>
<text x="522" y="463" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">HPSP</text>
<text x="380" y="510" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">Polling stays local to the door. The relay for the lock is driven only by an unlock with a signed grant.</text>
<rect x="20" y="554" width="720" height="190" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="572" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Migration A: transparent pass-through</text>
<rect x="40" y="598" width="130" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="105.0" y="624.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">OSDP reader</text>
<text x="105.0" y="642.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Existing, unchanged</text>
<rect x="305" y="592" width="150" height="82" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="380.0" y="615.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">HPSP device</text>
<text x="380.0" y="633.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Carries the serial</text>
<text x="380.0" y="651.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">bytes through</text>
<rect x="590" y="598" width="130" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="655.0" y="624.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ACU</text>
<text x="655.0" y="642.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Runs the OSDP panel</text>
<line x1="170" y1="633" x2="305" y2="633" stroke="#73726c" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="237" y="615" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#2C2C2A">RS-485</text>
<text x="237" y="651" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">OSDP</text>
<line x1="455" y1="633" x2="590" y2="633" stroke="#73726c" stroke-width="1.25" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="522" y="615" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#2C2C2A">TLS 1.3</text>
<text x="522" y="651" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">serial data</text>
<text x="380" y="696" text-anchor="middle" dominant-baseline="central" font-size="11.5" fill="#5F5E5A">Quick to start. The controller sees every poll, so it suits LAN-speed links.</text>
<text x="380" y="718" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#712B13">Door-release outputs must NOT be driven this way: that would open a door with no grant.</text>
<text x="380" y="774" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Source: specification section 10.4 (two ways to attach an OSDP reader) and 10.5 (mapping).</text>
<text x="380" y="794" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Where OSDP is the better fit: very small processors and existing RS-485 wiring.</text>
</svg>
