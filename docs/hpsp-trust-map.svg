<svg xmlns="http://www.w3.org/2000/svg" width="760" height="874" viewBox="0 0 760 874" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>HPSP trust map: who holds which key and who signs what</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="874" fill="#FFFFFF"/>
<text x="380" y="24" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#2C2C2A">Who holds which key, and who signs what</text>
<text x="380" y="46" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Solid arrow: signs (issues a certificate). Dashed arrow: checks.</text>
<rect x="20" y="70" width="340" height="520" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="88" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">The reader</text>
<rect x="400" y="70" width="340" height="520" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="416" y="88" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">The ACU (controller)</text>
<rect x="40" y="106" width="300" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="123.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Site certificate</text>
<text x="190.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Reader's identity on this site</text>
<text x="190.0" y="159.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Its key pair is made on the reader</text>
<rect x="40" y="196" width="300" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="213.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Trusted signers list</text>
<text x="190.0" y="231.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Keys allowed to sign unlock grants</text>
<text x="190.0" y="249.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Learned from the ACU (trust_update)</text>
<rect x="40" y="286" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="305.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Site root certificate</text>
<text x="190.0" y="323.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Used to check the ACU</text>
<rect x="40" y="362" width="300" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="190.0" y="379.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Setup-code verifier</text>
<text x="190.0" y="397.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Made at the factory from the printed code</text>
<text x="190.0" y="415.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">The code itself never crosses the wire</text>
<rect x="40" y="452" width="300" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="190.0" y="469.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Factory identity (IDevID)</text>
<text x="190.0" y="487.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Proves who made the reader</text>
<text x="190.0" y="505.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Kept through a factory reset</text>
<rect x="420" y="106" width="270" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="555.0" y="123.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Site root CA</text>
<text x="555.0" y="141.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Created with the site</text>
<text x="555.0" y="159.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Signs everything below</text>
<rect x="420" y="196" width="270" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="555.0" y="222.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ACU TLS certificate</text>
<text x="555.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Readers check it when they connect</text>
<rect x="420" y="286" width="270" height="70" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="555.0" y="303.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">Grant signer key</text>
<text x="555.0" y="321.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Signs every unlock grant</text>
<text x="555.0" y="339.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">Real site: kept in a hardware module</text>
<rect x="420" y="376" width="270" height="70" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="555.0" y="393.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Paired readers list</text>
<text x="555.0" y="411.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Device IDs, removed flags, trust epoch</text>
<text x="555.0" y="429.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Last event number stored from each</text>
<rect x="420" y="466" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="555.0" y="485.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Manufacturer roots accepted</text>
<text x="555.0" y="503.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">Demo: accepted on first sight</text>
<line x1="420" y1="141" x2="340" y2="141" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="127" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">signs at</text>
<text x="380" y="154" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">enrollment</text>
<line x1="555" y1="176" x2="555" y2="196" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<path d="M690 141 L712 141 L712 321 L690 321" fill="none" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="698" y="221" width="28" height="20" fill="#FFFFFF"/>
<text x="712" y="231" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">signs</text>
<rect x="20" y="622" width="340" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="190.0" y="641.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Manufacturer CA</text>
<text x="190.0" y="659.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">The maker's root (demo: one per simulated reader)</text>
<line x1="190" y1="622" x2="190" y2="522" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="272" y="575" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">signs at the factory</text>
<line x1="420" y1="494" x2="340" y2="494" stroke="#73726c" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="380" y="478" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">checks at</text>
<text x="380" y="508" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#2C2C2A">pairing</text>
<rect x="20" y="706" width="720" height="150" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="724" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">What each side checks</text>
<text x="40" y="748" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">ACU, every connection</text>
<text x="222" y="748" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#3d3d3a">site certificate chains to the site root; device is paired, not removed, and matches hello</text>
<text x="40" y="778" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Reader, every connection</text>
<text x="222" y="778" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#3d3d3a">ACU certificate chains to the site root it received when it was enrolled</text>
<text x="40" y="808" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Reader, every unlock</text>
<text x="222" y="808" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#3d3d3a">grant is signed by a key on its trusted signers list, for this reader and this session (next diagram)</text>
<text x="40" y="838" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Both, at pairing only</text>
<text x="222" y="838" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#3d3d3a">setup code proven with SPAKE2+; ACU checks the factory identity against a manufacturer root</text>
</svg>
