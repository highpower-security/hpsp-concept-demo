<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>What the reader checks before it opens the door</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="760" fill="#FFFFFF"/>
<text x="380" y="24" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#2C2C2A">What the reader checks before it opens the door</text>
<text x="380" y="46" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">A card swipe never opens a door by itself. Only a signed grant does.</text>
<rect x="40" y="70" width="680" height="96" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1"/>
<text x="380.0" y="100.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">The ACU signs a grant with its grant signer key</text>
<text x="380.0" y="118.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">The signed text names: this reader's device ID, this session's fresh value, a counter that only goes up,</text>
<text x="380.0" y="136.0" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">the connection id, the action (unlock or lock), how long, and when the grant expires</text>
<line x1="380" y1="166" x2="380" y2="196" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="392" y="181" text-anchor="start" dominant-baseline="central" font-size="11" fill="#2C2C2A">sent inside the encrypted session as an unlock message</text>
<rect x="20" y="198" width="720" height="520" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="216" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">The reader checks, in this order</text>
<text x="180" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#5F5E5A">The reader asks</text>
<text x="405" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#5F5E5A">If the answer is no</text>
<text x="590" y="236" text-anchor="middle" dominant-baseline="central" font-size="11.5" font-weight="600" fill="#5F5E5A">Attack it stops (ACU Attack demo menu)</text>
<rect x="40" y="252" width="280" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="180.0" y="278.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">1.  Is the signer one I trust?</text>
<text x="180.0" y="296.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Only keys learned from the site count</text>
<line x1="320" y1="287" x2="350" y2="287" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="352" y="269" width="106" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="405.0" y="287.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">unauthorized</text>
<text x="482" y="287" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">Grant signed by an untrusted key</text>
<line x1="180" y1="322" x2="180" y2="342" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="40" y="342" width="280" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="180.0" y="368.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">2.  Is the counter new?</text>
<text x="180.0" y="386.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Higher than every grant so far, and than my boot floor</text>
<line x1="320" y1="377" x2="350" y2="377" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="352" y="359" width="106" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="405.0" y="377.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">replay</text>
<text x="482" y="377" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">Replaying the last grant</text>
<line x1="180" y1="412" x2="180" y2="432" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="40" y="432" width="280" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="180.0" y="458.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">3.  Has it expired?</text>
<text x="180.0" y="476.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Checked when I hold trusted time</text>
<line x1="320" y1="467" x2="350" y2="467" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="352" y="449" width="106" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="405.0" y="467.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">expired</text>
<text x="482" y="467" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">A grant that expired 2 minutes ago</text>
<line x1="180" y1="502" x2="180" y2="522" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="40" y="522" width="280" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="180.0" y="548.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0C447C">4.  Does the signature verify?</text>
<text x="180.0" y="566.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">I rebuild the text from MY device ID and MY session</text>
<line x1="320" y1="557" x2="350" y2="557" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="352" y="539" width="106" height="36" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="405.0" y="557.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">bad_signature</text>
<text x="482" y="549" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">A grant from an old session, with a</text>
<text x="482" y="565" text-anchor="start" dominant-baseline="central" font-size="11.5" fill="#2C2C2A">flipped bit, or meant for another reader</text>
<line x1="180" y1="592" x2="180" y2="612" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="40" y="612" width="280" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="180.0" y="638.0" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#085041">5.  All checks pass</text>
<text x="180.0" y="656.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Remember the counter and open the door</text>
<text x="352" y="647" text-anchor="start" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">The door opens only now.</text>
<text x="380" y="742" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Order follows the specification (section 5.8). After a reboot the counter floor jumps ahead, so old grants stay dead.</text>
</svg>
