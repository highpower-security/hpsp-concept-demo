<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1040" viewBox="0 0 680 1040" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>HPSP: from ACU setup to door unlock</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="1040" fill="#FFFFFF"/>
<rect x="30" y="20" width="620" height="104" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="46" y="38" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">1 · Set up the ACU</text>
<rect x="170" y="56" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="310.0" y="75" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Create the site</text>
<text x="310.0" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Root, TLS and grant-signer keys</text>
<line x1="310" y1="112" x2="310" y2="174" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="30" y="140" width="620" height="190" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="46" y="158" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">2 · Commission the reader</text>
<rect x="170" y="176" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="310.0" y="195" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Pair the reader</text>
<text x="310.0" y="214" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Setup code + button, SPAKE2+</text>
<line x1="310" y1="232" x2="310" y2="256" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="170" y="258" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="310.0" y="277" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Enrol certificate</text>
<text x="310.0" y="296" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Reader gets its site identity</text>
<line x1="310" y1="314" x2="310" y2="380" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="30" y="346" width="620" height="190" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="46" y="364" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">3 · Connect</text>
<rect x="170" y="382" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="310.0" y="401" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Mutual TLS 1.3 session</text>
<text x="310.0" y="420" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Hybrid ML-KEM key exchange</text>
<line x1="310" y1="438" x2="310" y2="462" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="170" y="464" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="310.0" y="483" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Reader sends hello</text>
<text x="310.0" y="502" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Fresh 32-byte session value</text>
<line x1="310" y1="520" x2="310" y2="586" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="30" y="552" width="620" height="436" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="46" y="570" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">4 · Card to door</text>
<rect x="170" y="588" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="310.0" y="607" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Card swiped</text>
<text x="310.0" y="626" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Credential event to the ACU</text>
<line x1="310" y1="644" x2="310" y2="668" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="170" y="670" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="310.0" y="689" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Check access list</text>
<text x="310.0" y="708" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Allowed at this door now?</text>
<line x1="450" y1="698" x2="488" y2="698" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="469" y="684" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">no</text>
<rect x="490" y="670" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="560.0" y="689" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Deny</text>
<text x="560.0" y="708" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Red LED, logged</text>
<line x1="310" y1="726" x2="310" y2="750" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="294" y="738" text-anchor="end" dominant-baseline="central" font-size="12" fill="#5F5E5A">yes</text>
<rect x="170" y="752" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="310.0" y="771" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Send signed grant</text>
<text x="310.0" y="790" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Single-use, this session only</text>
<line x1="310" y1="808" x2="310" y2="832" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="170" y="834" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="310.0" y="853" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Reader verifies grant</text>
<text x="310.0" y="872" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Signature, session, counter</text>
<line x1="310" y1="890" x2="310" y2="914" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<rect x="170" y="916" width="280" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="310.0" y="935" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Strike unlocks</text>
<text x="310.0" y="954" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Relocks; door event to ACU</text>
<rect x="170" y="1006" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="190" y="1013" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">ACU</text>
<rect x="250" y="1006" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="270" y="1013" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Reader / door hardware</text>
<rect x="440" y="1006" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="460" y="1013" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Both / outcome</text>
</svg>
