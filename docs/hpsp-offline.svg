<svg xmlns="http://www.w3.org/2000/svg" width="760" height="860" viewBox="0 0 760 860" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>HPSP when the cable is pulled: events are kept and replayed</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="860" fill="#FFFFFF"/>
<text x="380" y="24" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#2C2C2A">What happens when the network cable is pulled</text>
<text x="380" y="46" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">The reader keeps events until the ACU acknowledges them. Event numbers below are examples.</text>
<rect x="60" y="64" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="140.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Reader</text>
<rect x="540" y="64" width="160" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="620.0" y="86.0" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">ACU</text>
<line x1="140" y1="108" x2="140" y2="836" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 4"/>
<line x1="620" y1="108" x2="620" y2="836" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 4"/>
<rect x="20" y="120" width="720" height="140" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="138" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">1 · Online</text>
<line x1="140" y1="176" x2="620" y2="176" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="164" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Card swiped: credential event, seq 41</text>
<line x1="620" y1="222" x2="140" y2="222" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="210" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">ack 41</text>
<text x="380" y="236" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Then the ACU decides and sends a signed unlock</text>
<rect x="20" y="274" width="720" height="190" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="292" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">2 · Cable pulled</text>
<rect x="32" y="312" width="190" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="127.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">Session lost</text>
<text x="127.0" y="351.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">Reader notices the link is gone</text>
<rect x="538" y="312" width="190" height="60" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
<text x="633.0" y="333.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#712B13">Reader offline</text>
<text x="633.0" y="351.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#993C1D">ACU misses its heartbeats</text>
<rect x="32" y="386" width="190" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="127.0" y="400.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#0C447C">Card swiped offline</text>
<text x="127.0" y="418.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Event seq 42 is stored</text>
<text x="127.0" y="436.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#185FA5">Critical events survive power loss</text>
<text x="380" y="350" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#993C1D">no connection</text>
<rect x="20" y="476" width="720" height="250" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="494" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">3 · Cable plugged back in</text>
<line x1="140" y1="530" x2="620" y2="530" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="518" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">New TLS 1.3 session, then hello</text>
<text x="380" y="544" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">Fresh session value for this connection</text>
<line x1="620" y1="588" x2="140" y2="588" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="576" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">hello response: resume_from 42</text>
<text x="380" y="602" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">The first event number the ACU does not have</text>
<line x1="140" y1="646" x2="620" y2="646" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="634" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">Replays event 42</text>
<line x1="620" y1="696" x2="140" y2="696" stroke="#73726c" stroke-width="1.25" marker-end="url(#a)"/>
<text x="380" y="684" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">ack 42</text>
<rect x="20" y="738" width="720" height="98" rx="12" fill="none" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="36" y="756" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">4 · Result</text>
<rect x="380" y="776" width="340" height="48" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="550.0" y="791.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#2C2C2A">ACU logs the offline swipe</text>
<text x="550.0" y="809.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#5F5E5A">No door opens: card reads over 5 s old are never acted on</text>
<rect x="40" y="776" width="300" height="48" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="190.0" y="791.0" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#085041">Nothing was lost</text>
<text x="190.0" y="809.0" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#0F6E56">Event 42 is in the ACU's log, in order</text>
</svg>
